# GoOuts Host — iOS build and TestFlight upload.
#
# Modelled on driver_app/.github/workflows/ios-testflight.yml, which is the
# workflow that actually works. Three things differ and all three matter:
#
#   1. The bundle id is com.goouts.host, not com.goouts.lead. fetch-signing-files
#      creates a provisioning profile for whatever id it is given, so a copied
#      id would sign this app with the wrong profile and fail at upload with a
#      mismatch that reads like a certificate problem.
#
#   2. The build number starts at 1, not 500. driver_app is offset because it
#      has 500-odd historical builds; GoOuts Host has none, and starting high
#      would waste the range and make the numbers meaningless.
#
#   3. The artifact name, so a downloaded IPA is identifiable.
#
# NOTE ON "Install Codemagic CLI tools": that step stays despite GoOuts no
# longer using Codemagic as a CI service. codemagic-cli-tools is a standalone
# open-source package — `keychain`, `app-store-connect` and `xcode-project` are
# its commands. It has nothing to do with the hosted Codemagic product and is
# the same toolchain driver_app uses on GitHub Actions today.

name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-26
    # 90, not 60. The job now WAITS for Apple to finish processing the build
    # before attaching it to the beta group (see the Publish step). Build and
    # upload alone take ~25 minutes; processing can add up to 30 more. At 60
    # the job would be killed mid-wait and the build would go unattached —
    # the exact failure this change exists to prevent.
    timeout-minutes: 90

    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # ── ANALYZE FIRST, BEFORE ANY SIGNING OR BUILD STEP ────────────────────
      #
      # Order matters here and it is not cosmetic.
      #
      # This step used to sit AFTER `xcode-project use-profiles`, which makes
      # Swift Package Manager check third-party sources out into
      # build/ios/SourcePackages/. Those checkouts include the Firebase SDK's
      # own unit tests, which import package:mockito — a dev dependency of
      # Firebase, not of this app. `flutter analyze` read them and reported 645
      # errors, none of them in code anyone here wrote.
      #
      # analysis_options.yaml now excludes build/** as well, so either fix
      # alone would do. Both are kept: the exclude protects local runs, and
      # running first means a genuine code error costs two minutes instead of
      # twenty-five.
      # ── ⚠ --no-fatal-infos, ADDED 24 August 2026 ─────────────────────────
      #
      # Bare `flutter analyze` exits 1 on ANY issue, including infos. An info
      # is a style suggestion — "use '_' instead of '__'", "this import is
      # redundant" — and none of them can make an app misbehave.
      #
      # So this step was failing the build, and the release, over formatting
      # opinions, while goouts_app's own workflow has always run
      # `--no-fatal-infos`. THE SAME CODE PASSED IN ONE REPO AND FAILED IN
      # ANOTHER, which is the worst version of a red X: it looks like a real
      # regression and it is a difference in two YAML files.
      #
      # ⚠ THIS STILL FAILS ON WARNINGS AND ERRORS. It has to. An unawaited
      # Future or a dead null check is a defect, and one of those has already
      # cost this project a build. Only the cosmetic tier is downgraded.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Install Codemagic CLI tools
        run: pipx install codemagic-cli-tools

      - name: Initialize keychain
        run: keychain initialize

      - name: Fetch iOS signing files (App Store)
        run: |
          app-store-connect fetch-signing-files com.goouts.host \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add certificates to keychain
        run: keychain add-certificates

      - name: Apply provisioning profiles
        run: xcode-project use-profiles

      - name: Set build number
        run: |
          BUILD_NUM=$GITHUB_RUN_NUMBER
          echo "iOS build number -> $BUILD_NUM"
          cd ios && agvtool new-version -all "$BUILD_NUM"

      # ── MAPBOX_TOKEN COMES FROM A REPOSITORY SECRET, NOT FROM THE SOURCE ──
      #
      # 13 August 2026. The token used to be hardcoded in
      # lib/services/address_lookup_service.dart. On the day this repo was made
      # public, GitHub push protection refused the push (GH013) because it
      # recognised a live Mapbox token in the diff. It was right to.
      #
      # A Mapbox token is BILLABLE and public repos are scraped for them, so a
      # leak is somebody else's address lookups on our invoice. The previous
      # token had to be rotated across six files in four repositories.
      #
      # ⚠ IF THIS SECRET IS MISSING the build still SUCCEEDS — --dart-define
      # simply passes an empty string. The app installs, looks completely
      # normal, and every postcode lookup silently returns nothing. There is no
      # build error to catch it. AddressLookupService logs a loud warning at
      # runtime for exactly this reason; look for "MAPBOX_TOKEN is empty" in
      # the device console if addresses stop resolving after a build.
      #
      # Add it at: Settings > Secrets and variables > Actions > MAPBOX_TOKEN
      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }} \
            --export-options-plist="$HOME/export_options.plist"

      # ── ATTACH THE BUILD TO THE TESTER GROUP AUTOMATICALLY ─────────────────
      #
      # ADDED 7 August 2026, to remove a manual step that was being done by
      # hand after every single build.
      #
      # Uploading a build and DISTRIBUTING a build are two separate things.
      # `publish` on its own only does the first. The build lands in the
      # TestFlight tab, processing completes, and then it sits there attached
      # to no group — so there is nobody for Apple to notify. Nothing reports
      # this as an error. Builds 4 and 5 each had to be attached by hand in
      # the console afterwards, which is easy to forget and impossible to
      # notice when forgotten.
      #
      # --beta-group does the attaching as part of the same command, once
      # processing finishes. The name must match the group in App Store
      # Connect EXACTLY, including capitals and spaces.
      #
      # ⚠ It must be "GoOuts Host Testers", NOT "GoOuts Internal". The latter
      # was created with "Enable automatic distribution" ticked, which cannot
      # be changed afterwards and which blocks anything from being added by
      # any route. It holds build 4 and can never hold another.
      #
      # Note there is no --testflight flag. That one submits for Beta App
      # Review, which is only needed for EXTERNAL testers and which locks the
      # build's group controls while Apple looks at it. This group is
      # internal, so the build is available the moment processing ends.
      #
      # No --whats-new either, deliberately. This step is being changed for
      # the first time on a build that matters, so it changes by exactly ONE
      # variable. Release notes are cosmetic; if they turned out to need
      # --testflight to take effect, a failure here would be indistinguishable
      # from --beta-group being wrong. Add them next build, once this is
      # proven.
      - name: Publish to TestFlight
        run: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --beta-group "GoOuts Host Testers" \
            --max-build-processing-wait 30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoOuts-Host-ipa
          path: build/ios/ipa/*.ipa
